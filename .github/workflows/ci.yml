# ci.yml — build, fmt/vet and the full test sweep (unit + draft-2020-12
# conformance).

name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # plain `json2` (the JSON backend vschema builds on) only exists in
      # current V master; releases up to 0.5.2 ship the incompatible x.json2,
      # so the pin is a master commit - the local dev compiler - not a release
      # tag. The action sha itself is pinned (the vsl/vtl pattern).
      - name: install V (pinned master commit, the compiler the repo is verified against)
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          version: d126ca3fd329aa7be68efcc2f61d074f8b5dfd3f

      # property_test.v drives its checks with hypo; the import resolves
      # from ~/.vmodules at compile time.
      - name: install hypo (property_test.v's seeded checker)
        run: v install gil-silva.hypo

      - name: fmt and vet
        run: |
          v fmt -c .
          v vet .

      - name: fetch the official test suite (pinned commit; CI reproduces the README conformance with it)
        run: |
          curl -fsSL https://github.com/json-schema-org/JSON-Schema-Test-Suite/archive/ed0ebd31d0a83fd79e99a32aa0c884b966ada057.tar.gz | tar -xz
          mv JSON-Schema-Test-Suite-ed0ebd31d0a83fd79e99a32aa0c884b966ada057 testsuite

      - name: build
        run: v .

      - name: test (unit + draft-2020-12 conformance)
        run: v -no-parallel test ./vschema
